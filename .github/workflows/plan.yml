name: Terraform PR Plan

on:
  pull_request:
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.github/workflows/**'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Copy example tfvars for CI
        working-directory: environments/dev
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Terraform plan
        working-directory: environments/dev
        env:
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -no-color -var="ssh_public_key=${ADMIN_SSH_PUBLIC_KEY}"

      - name: Terraform fmt
        working-directory: environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform plan
        working-directory: environments/dev
        run: terraform plan -input=false -no-color
